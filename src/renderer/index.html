<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <title>أبو الدهب — مشاوي شاورما كشري — نظام الكاشير وإدارة المطعم</title>
  <!--
    The till is designed to run with no internet connection, so the webfonts that
    used to be pulled from fonts.googleapis.com are gone: on an offline machine they
    only ever produced a render delay before falling back anyway. Arabic text now
    uses the system UI stack (see --font-family in index.css).

    The CSP is deliberately strict. 'unsafe-inline' for styles is required because
    the screens use inline style={{...}} props throughout; scripts have no such
    exemption, and no remote origin is reachable from this page at all.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src 'self';
                 form-action 'none';
                 base-uri 'none'" />
  <!-- frame-ancestors is intentionally omitted: it is ignored when delivered via
       <meta>, and the app is a top-level Electron window that is never framed. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
