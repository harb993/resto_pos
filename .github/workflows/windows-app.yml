name: Windows app

# Builds the أبو الدهب till on a real Windows machine and attaches it to the run as a
# download: Actions → the latest "Windows app" run → Artifacts → AboElDahab-Windows.
# Unzip it, move the "aboeldahab" folder to the Desktop and run AboElDahab.exe.
#
# Then it starts that build on the same Windows machine and reads its log, so a build
# that cannot open its database or reach its first screen is caught here rather than
# at the restaurant.

on:
  push:
    branches: ['claude/affectionate-knuth-hmaykf']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches better-sqlite3 built for Electron on Windows.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # On Windows electron-builder stamps the logo (build/icon.ico) into the .exe itself.
      - name: Package
        run: npx electron-builder --win dir --x64 --publish never

      - name: Assemble the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/win-unpacked release/aboeldahab -Recurse
          Copy-Item tools/first-run/* release/aboeldahab/
          $exe = Get-Item release/aboeldahab/AboElDahab.exe
          "AboElDahab.exe: $([math]::Round($exe.Length / 1MB)) MB, version $($exe.VersionInfo.FileVersion)"
          $native = Get-ChildItem release/aboeldahab/resources -Recurse -Filter better_sqlite3.node
          if (-not $native) { throw 'better_sqlite3.node is missing from the package' }
          $native.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: AboElDahab-Windows
          path: release/
          retention-days: 30

      # The quick update: only resources\app.asar, the update script and its guide —
      # for a till that already has the program, so the data folder is never touched.
      - name: Assemble the quick update
        shell: pwsh
        run: |
          $u = 'update/AboElDahab-Update'
          New-Item -ItemType Directory -Force "$u/resources" | Out-Null
          Copy-Item dist/win-unpacked/resources/app.asar "$u/resources/"
          Copy-Item tools/UPDATE.bat, tools/update.ps1 $u
          Copy-Item tools/quick-update/* $u
          Get-ChildItem $u -Recurse -File | ForEach-Object { "$($_.FullName.Substring((Resolve-Path $u).Path.Length)) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: AboElDahab-Update
          path: update/
          retention-days: 30

      # On a copy, so the database the first run creates never ends up in the download.
      - name: Smoke test — start it and read its log
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item release/aboeldahab (Join-Path $root 'aboeldahab') -Recurse
          $exe = Join-Path $root 'aboeldahab\AboElDahab.exe'

          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Get-Process AboElDahab -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          $log = Get-ChildItem $env:APPDATA -Recurse -Filter main.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) { throw 'the app wrote no log — it did not start' }
          "---- $($log.FullName)"
          Get-Content $log.FullName -Tail 80

          if (-not $alive) { throw 'the app exited by itself within 30 seconds' }
          if (-not (Select-String -Path $log.FullName -Pattern 'Schema applied' -Quiet)) { throw 'the database did not open' }
          if (-not (Select-String -Path $log.FullName -Pattern '\[License\] Device' -Quiet)) { throw 'startup did not finish' }
          if (-not (Test-Path (Join-Path $root 'aboeldahab\data\restaurant.db'))) { throw 'no data\restaurant.db beside the exe' }

          # The first-run desktop shortcut, and that it opens this .exe. Every desktop
          # Windows might mean is listed, with what each shortcut on it opens.
          $shell = New-Object -ComObject WScript.Shell
          $want = [IO.Path]::GetFullPath($exe)
          $dirs = @(
            [Environment]::GetFolderPath('Desktop'),
            [Environment]::GetFolderPath('DesktopDirectory'),
            [Environment]::GetFolderPath('CommonDesktopDirectory'),
            (Join-Path $env:USERPROFILE 'Desktop')
          ) | Where-Object { $_ -and (Test-Path $_) } | Sort-Object -Unique
          $found = $false
          # WScript cannot open a .lnk whose NAME is Arabic — it hands back an empty
          # shortcut instead of failing — so each one is read through an ASCII-named copy.
          $probe = Join-Path $env:RUNNER_TEMP 'probe.lnk'
          foreach ($d in $dirs) {
            foreach ($l in Get-ChildItem -LiteralPath $d -Filter *.lnk -ErrorAction SilentlyContinue) {
              Copy-Item -LiteralPath $l.FullName $probe -Force
              $sc = $shell.CreateShortcut($probe)
              "shortcut: $($l.FullName) -> $($sc.TargetPath) | icon $($sc.IconLocation) | start in $($sc.WorkingDirectory)"
              if ($sc.TargetPath -and ([IO.Path]::GetFullPath($sc.TargetPath) -ieq $want)) { $found = $true }
            }
          }
          if (-not $found) { throw "no desktop shortcut opens $want (looked in: $($dirs -join ', '))" }

      # What the owner does: unzip the quick update and double-click UPDATE.bat, with
      # no folder given. It must find the program on its own — here, through the
      # desktop shortcut the smoke test's first run just made — and update it.
      - name: Quick update — finds the program by itself
        shell: pwsh
        run: |
          $u = (Resolve-Path update/AboElDahab-Update).Path
          $out = Join-Path $env:RUNNER_TEMP 'update-out.txt'
          $p = Start-Process cmd -ArgumentList '/c', "`"$u\UPDATE.bat`"" -PassThru -NoNewWindow -RedirectStandardOutput $out
          # It ends waiting for Enter; give it time to get there, then close it.
          $null = $p.WaitForExit(90000)
          Start-Sleep -Seconds 3
          Get-Process powershell -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Get-Content $out -ErrorAction SilentlyContinue
          $resources = Join-Path $env:RUNNER_TEMP 'smoke\aboeldahab\resources'
          $backup = Get-ChildItem $resources -Filter 'app.asar.backup-*' -ErrorAction SilentlyContinue
          if (-not $backup) { throw 'UPDATE.bat did not find and update the program by itself' }
          "updated, old copy kept as $($backup.Name)"
